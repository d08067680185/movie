services:
  backend:
    build: ./backend
    container_name: movie-backend
    restart: unless-stopped
    volumes:
      - ./backend/movie_search.db:/app/movie_search.db
      # 持久化 backend/.env：ADMIN_PASSWORD_HASH 写在这里才能扛过容器重建。
      # 注意这个文件与仓库根目录的 .env（docker-compose 变量替换用）是两个不同文件。
      - ./backend/.env:/app/.env
      - ./backend/downloads:/app/downloads
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./movie_search.db
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://movie.mxzshs.com}
      - SPIDER_INTERVAL_HOURS=${SPIDER_INTERVAL_HOURS:-6}
      - PANSOU_URL=http://pansou:8888
      - DOWNLOAD_DIR=/app/downloads
      - TZ=Asia/Shanghai
    expose:
      - "8000"
    depends_on:
      - pansou
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 部署机 Docker Desktop VM 只分到 5 vCPU / 2.845GiB(docker info 实测)，还跑着其他
    # 好几个项目的容器；这里给的是保守上限，不是"应得配额"——只是防止 yt-dlp+ffmpeg
    # 合并等突发内存尖峰把同一台机器上别的站点也拖垮(历史上出过 auto-pull.sh 里记录的
    # "5个build并发、load 9.8、全站超时"事故，这次是防同类问题但换成运行时场景)
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.5"

  pansou:
    image: ghcr.io/fish2018/pansou:latest
    container_name: movie-pansou
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      # 2026-08-10: 此前完全没设这两项，实际靠镜像内置默认值生效(101频道/61插件)——
      # 镜像升级时这个默认值可能被作者悄悄改掉且无迹可查，所以把当时线上实际生效的
      # 值(docker exec printenv 拿到的 ground truth)+ 官方 README 最新示例里多出来的
      # 频道/插件显式写死在这里，配置可追溯、不再依赖镜像默认值
      # 2026-08-16: 现有118个频道明显偏影视/网盘分享向，非视频类关键词覆盖很弱
      # (如"钢琴谱"搜索 total=0)。联网核实公开信息追加7个音乐/软件/综合类频道，
      # 真实性无法100%验证(TG频道没有官方可枚举全集)——用 pansou_source_stats
      # 表监控实际命中率，两周后 hit_count 仍是0的视为死频道再清理，不追求一次性做对
      # 2026-08-16: 对比同类开源项目 PanHub(wu529778790/panhub.shenzjd.com)默认的
      # 69个频道，47个跟我们已有的重合、22个是它独有的——追加进来，都是同一玩法
      # (公开TG频道用户名)，不涉及额外基础设施，跟上面补插件是同一套路
      - CHANNELS=tgsearchers6,Aliyun_4K_Movies,bdbdndn11,yunpanx,bsbdbfjfjff,yp123pan,sbsbsnsqq,yunpanxunlei,tianyifc,BaiduCloudDisk,txtyzy,peccxinpd,gotopan,PanjClub,kkxlzy,baicaoZY,MCPH01,MCPH02,MCPH03,bdwpzhpd,ysxb48,jdjdn1111,yggpan,MCPH086,zaihuayun,Q66Share,ucwpzy,shareAliyun,alyp_1,dianyingshare,Quark_Movies,XiangxiuNBB,ydypzyfx,ucquark,xx123pan,yingshifenxiang123,zyfb123,tyypzhpd,tianyirigeng,cloudtianyi,hdhhd21,Lsp115,oneonefivewpfx,qixingzhenren,taoxgzy,Channel_Shares_115,tyysypzypd,vip115hot,wp123zy,yunpan139,yunpan189,yunpanuc,yydf_hzl,leoziyuan,pikpakpan,Q_dongman,yoyokuakeduanju,TG654TG,WFYSFX02,QukanMovie,yeqingjie_GJG666,movielover8888_film3,Baidu_netdisk,D_wusun,FLMdongtianfudi,KaiPanshare,QQZYDAPP,rjyxfx,PikPak_Share_Channel,btzhi,newproductsourcing,cctv1211,duan_ju,QuarkFree,yunpanNB,kkdj001,xxzlzn,pxyunpanxunlei,jxwpzy,kuakedongman,liangxingzhinan,xiangnikanj,solidsexydoll,guoman4K,zdqxm,kduanju,cilidianying,CBduanju,SharePanFilms,dzsgx,BooksRealm,Oscar_4Kmovies,douerpan,baidu_yppan,Q_jilupian,Netdisk_Movies,yunpanquark,ammmziyuan,ciliziyuanku,cili8888,jzmm_123pan,Q_dianying,domgmingapk,dianying4k,q_dianshiju,tgbokee,ucshare,godupan,gokuapan,gimy115,WFYSFX03,peccxin,Movie888035,xlwpzy,zyywpzy,wydwpzy,gimy100,gimy115iso,wsmusic0,konghou,changba_tg,pj_cn,OOAPK,lcgfx,yunpanshare,AliyunDrive_Share_Channel,Maidanglaocom,NewAliPan,NewQuark,Quark_Share_Channel,aliyunys,alyp_4K_Movies,alyp_Animation,alyp_JLP,alyp_TV,baiduyun,iAliyun,kuakeyun,quanziyuanshe,quarkshare,share_aliyun,tgsearchers115,tgsearchers3,xingqiump4,ypquark,yunpanpan,yunpanqk
      # 2026-08-16: 对比 PanSou 官方仓库 plugin/ 目录(用GitHub API精确枚举，共90个
      # 插件实现——上次记的121是WebFetch摘要工具算错的数字，已订正)发现这12个
      # 镜像里已经有实现、但此前一直没写进启用列表——补齐，插件层面现已配满，没有更多可加
      # pioz 已从列表移除：GitHub API 查 plugin/pioz/ 目录发现只有一个1.txt数据文件，
      # 没有任何.go源码，是仓库里一个非插件的杂项目录，本来就不该被当成插件启用
      - ENABLED_PLUGINS=ddys,erxiao,hdr4k,jutoushe,labi,libvio,panta,susu,wanou,xuexizhinan,zhizhen,ahhhhfs,ash,clxiong,discourse,djgou,duoduo,hdmoli,huban,leijing,muou,nsgame,ouge,panyq,shandian,xinjuc,yunsou,aikanzy,bixin,cldi,clmao,cyg,fox4k,gying,haisou,hunhepan,jikepan,miaoso,nyaa,pan666,pansearch,panwiki,pianku,qqpd,quark4k,quarksoo,qupanshe,qupansou,sdso,sousou,thepiratebay,wuji,xb6v,xdpan,xdyh,xiaoji,xiaozhang,xys,yuhuage,javdb,u3c3,weibo,feikuai,kkmao,alupan,ypfxw,mikuclub,daishudj,dyyj,meitizy,jsnoteclub,mizixing,lou1,yiove,zxzj,qingying,kkv,yulinshufa,duanjuw,dyyjpro,gaoqing888,jupansou,lingjisp,melost,panlian,panzun,qiwei,quarktv,yunso
    expose:
      - "8888"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          # 384M -> 512M：频道/插件规模扩大约17%，实测扩容前只用13%内存(51MB/384MB)，
          # 512M留足安全边际；宿主机3.09GiB里当时约2GB空闲，不影响同机其他容器
          memory: 512M
          cpus: "1.0"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ""
        BACKEND_URL: "http://backend:8000"
    container_name: movie-frontend
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - BACKEND_URL=http://backend:8000
    ports:
      - "8092:3000"
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
